<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <title>Gargaarsa Waldaa</title>
</head>
<body>

    <button id="playBtn" style="padding: 20px; font-size: 20px; cursor: pointer;">
        👉 Accept & Help (Farfaannaa Banuuf)
    </button>

    <!-- Koodiin kun faayila "farfaanna.mp3" kan repo kee keessa jiru fayyadama -->
    <audio id="myAudio">
        <source src="farfaanna.mp3" type="audio/mpeg">
    </audio>

    <script>
        const btn = document.getElementById('playBtn');
        const audio = document.getElementById('myAudio');

        btn.addEventListener('click', function() {
            audio.play().then(() => {
                alert("Farfaannaan jalqabeera!");
            }).catch(error => {
                alert("Farfaannaan hin jalqabne, faayilichi sirriitti jiraachuu isaa mirkaneessi.");
                console.log(error);
            });
        });
    </script>
</body>
</html>

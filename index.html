<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargaarsa Waldaa W/W/W/M/Y Tiibee Haaraa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.75)), url('waldaa.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay-container {
            background-color: rgba(255, 255, 255, 0.96);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            max-width: 480px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(10px);
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Halluu Mata Dureewwanii */
        h1 { 
            color: #2c3e50; /* Buluu Dukkanaawaa */
            font-size: 20px; 
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        h3 { 
            color: #e74c3c; /* Diimaa Ifaa */
            font-size: 15px; 
            margin-top: 0; 
            margin-bottom: 20px; 
            font-weight: 600;
        }
        p { 
            color: #2f3640; 
            line-height: 1.6; 
            font-size: 14.5px; 
            text-align: justify; 
        }

        /* Kutaa barruu keessatti halluu addaa kennuuf */
        .highlight-blue { color: #2980b9; font-weight: bold; }
        .highlight-green { color: #27ae60; font-weight: bold; }
        .highlight-orange { color: #d35400; font-weight: bold; }
        
        .play-prompt {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 14px;
            border-radius: 50px;
            font-weight: bold;
            margin-bottom: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            transition: transform 0.2s;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
            50% { transform: scale(1.04); box-shadow: 0 6px 20px rgba(231, 76, 60, 0.6); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
        }

        /* Halluu Caqasaa */
        .quote { 
            font-style: italic; 
            background-color: #f7fafc; 
            padding: 12px; 
            border-left: 4px solid #e67e22; 
            margin: 15px 0; 
            font-size: 14px; 
            text-align: center;
            color: #8e44ad; /* Barruu Dhiilgee/Purple */
            border-radius: 0 8px 8px 0;
            font-weight: 500;
        }
        
        .bank-details { 
            background-color: #f0f7f9; 
            padding: 20px; 
            border-radius: 12px; 
            margin-top: 20px; 
            display: none; 
            font-size: 14px; 
            text-align: left; 
            border: 1px solid #cee5ed;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bank-details h4 {
            margin-top: 15px;
            margin-bottom: 8px;
            color: #2980b9; 
            border-bottom: 2px solid #2ecc71;
            padding-bottom: 3px;
            display: inline-block;
        }
        .bank-details h4:first-of-type {
            margin-top: 0;
        }
        .bank-route {
            margin-bottom: 15px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #2ecc71;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .phone-list p {
            margin: 6px 0;
            font-weight: 500;
            color: #34495e;
        }

        .notice-text {
            color: #c0392b; 
            font-weight: bold;
            font-size: 12.5px;
            margin-top: 15px;
            border-top: 1px dashed #cbd5e0;
            padding-top: 12px;
            text-align: justify;
        }

        .btn { 
            background: linear-gradient(135deg, #2ecc71, #27ae60); 
            color: white; 
            border: none; 
            padding: 14px 30px; 
            font-size: 15px; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            margin-top: 15px; 
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.6);
        }
        audio { display: none; }
    </style>
</head>
<body>
